apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nti
  namespace: nti
spec:
  project: default

  source:
    repoURL: https://github.com/eng-mohamedamr/End-to-End-project
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true